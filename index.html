<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080807" />
    <meta name="description" content="以 Three.js 粒子重构钧瓷器型的数字陶瓷实验室。" />
    <link rel="icon" href="data:," />
    <title>粒界 · 数字陶瓷实验室</title>
    <script type="module" crossorigin src="./assets/index-C53X4ezH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CV_XemGF.css">
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="可旋转的钧瓷粒子展品"></canvas>

      <div class="loading" id="loading" role="status">
        <span class="loading__mark"></span>
        <span>正在入窑</span>
      </div>

      <header class="topbar">
        <a class="brand" href="#" aria-label="粒界数字陶瓷实验室首页">
          <span class="brand__mark" aria-hidden="true"></span>
          <span><b>粒界</b><small>DIGITAL CERAMICS LAB</small></span>
        </a>
        <div class="telemetry" aria-label="运行状态">
          <span><small>FPS</small><b id="fps">60</b></span>
          <span><small>粒子</small><b id="particle-count">12K</b></span>
          <span><small>输入</small><b id="gesture-label">鼠标</b></span>
        </div>
        <button class="icon-button" id="fullscreen-button" type="button" aria-label="进入全屏" title="进入全屏">
          <i data-lucide="maximize-2"></i>
        </button>
      </header>

      <section class="exhibit-title" aria-labelledby="artifact-name">
        <span class="exhibit-index">NO. 01 / JUN WARE STUDY</span>
        <h1 id="artifact-name">窑变双系尊</h1>
        <p>铜红入天青，粒子模拟釉色在器表的聚散与流动。</p>
      </section>

      <section class="control-panel" aria-label="陶瓷粒子控制台">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">KILN CONTROL</span>
            <h2>粒子控制台</h2>
          </div>
          <span class="live-dot">窑温稳定</span>
        </div>

        <div class="control-group">
          <span class="control-label">器型</span>
          <div class="shape-switcher" id="shape-switcher" role="group" aria-label="选择粒子形态">
            <button class="shape-button is-active" type="button" data-shape="ceramic" title="钧瓷" aria-label="钧瓷"><i data-lucide="amphora"></i></button>
            <button class="shape-button" type="button" data-shape="sphere" title="星球" aria-label="星球"><i data-lucide="circle-dot"></i></button>
            <button class="shape-button" type="button" data-shape="galaxy" title="星系" aria-label="星系"><i data-lucide="orbit"></i></button>
            <button class="shape-button" type="button" data-shape="heart" title="心形" aria-label="心形"><i data-lucide="heart"></i></button>
            <button class="shape-button" type="button" data-shape="helix" title="双螺旋" aria-label="双螺旋"><i data-lucide="dna"></i></button>
            <button class="shape-button" type="button" data-shape="wave" title="波面" aria-label="波面"><i data-lucide="waves"></i></button>
          </div>
        </div>

        <div class="control-group state-group">
          <span class="control-label">粒子状态</span>
          <div class="state-switcher" id="state-switcher" role="group" aria-label="选择粒子状态">
            <button class="state-button is-active" type="button" data-state="0" title="聚合"><i data-lucide="combine"></i><span>聚合</span></button>
            <button class="state-button" type="button" data-state="1" title="漂移"><i data-lucide="wind"></i><span>漂移</span></button>
            <button class="state-button" type="button" data-state="2" title="解构"><i data-lucide="expand"></i><span>解构</span></button>
          </div>
        </div>

        <label class="range-row">
          <span>粒子尺寸 <output id="size-output">1.8</output></span>
          <input id="size-control" type="range" min="0.8" max="3.6" step="0.1" value="1.8" />
        </label>
        <label class="range-row">
          <span>动态强度 <output id="motion-output">42%</output></span>
          <input id="motion-control" type="range" min="0" max="100" value="42" />
        </label>
        <label class="range-row">
          <span>场域范围 <output id="field-output">68%</output></span>
          <input id="field-control" type="range" min="30" max="100" value="68" />
        </label>

        <div class="palette-row">
          <span class="control-label">釉色</span>
          <div class="swatches" role="group" aria-label="选择粒子釉色">
            <button class="swatch is-active" type="button" data-palette="0" aria-label="窑变" title="窑变" style="--swatch:#b95c43"></button>
            <button class="swatch" type="button" data-palette="1" aria-label="天青" title="天青" style="--swatch:#79b9bd"></button>
            <button class="swatch" type="button" data-palette="2" aria-label="铜紫" title="铜紫" style="--swatch:#81556b"></button>
            <button class="swatch" type="button" data-palette="3" aria-label="月白" title="月白" style="--swatch:#ded7c3"></button>
          </div>
        </div>

        <button class="camera-button" id="camera-button" type="button">
          <i data-lucide="scan-face"></i>
          <span><b>启用手势塑形</b><small>影像仅在本机处理</small></span>
          <i data-lucide="chevron-right"></i>
        </button>
      </section>

      <aside class="camera-preview" id="camera-preview" aria-label="手势识别预览" hidden>
        <video id="camera-video" autoplay muted playsinline></video>
        <canvas id="hand-overlay"></canvas>
        <div class="camera-preview__status"><span></span><b id="camera-status">正在识别</b></div>
        <button class="icon-button camera-close" id="camera-close" type="button" aria-label="关闭摄像头" title="关闭摄像头"><i data-lucide="x"></i></button>
      </aside>

      <div class="gesture-guide" id="gesture-guide">
        <span><i data-lucide="move"></i> 拖动旋转</span>
        <span><i data-lucide="hand"></i> 开合聚散</span>
        <span><i data-lucide="mouse-pointer-click"></i> 双手缩放</span>
        <span><i data-lucide="sparkles"></i> 腕线旋转</span>
      </div>

      <div class="webgl-fallback" id="webgl-fallback" hidden>
        <img src="./ceramic-fallback.jpg" alt="窑变钧瓷实拍展品" />
        <div>
          <span>STATIC EXHIBIT</span>
          <h1>窑变双系尊</h1>
          <p>当前设备无法启动 WebGL，已切换为静态展陈。</p>
        </div>
      </div>
    </main>
  </body>
</html>
